name: PayPulse Data Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate dataset & run SQL analytics pipeline
        run: |
          python data/generate_data.py
          python src/pipeline.py

      - name: Run automated data quality & reconciliation tests
        run: python -m unittest discover -s tests -v
